name: CortexInferno CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Host build + tests (scalar fallback) ──
  host-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ cppcheck python3 python3-pip
          pip3 install -r tools/requirements.txt

      - name: Configure (CI scalar build)
        run: cmake -B build -DCI_BUILD=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        run: cd build && ctest --output-on-failure

      - name: Static analysis (cppcheck)
        run: |
          cppcheck --enable=all --std=c++20 --suppress=missingIncludeSystem \
            --error-exitcode=1 src/ include/

  # ── ARM cross-compilation check ──
  arm-cross-compile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake

      - name: Configure for Cortex-M7
        run: |
          cmake -B build_arm \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm_toolchain.cmake \
            -DENABLE_DSP=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Cross-compile
        run: cmake --build build_arm -j$(nproc)

  # ── Python tooling tests ──
  python-tools:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r tools/requirements.txt

      - name: Test model converter
        run: python3 tools/model_converter.py --help